<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Coding Club Student Registration">
    <title>Coding Club - Register</title>

    <link rel="icon" href="favicon.ico">
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Join Our Coding Club Today!</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <hr>

    <form action="#" method="post">

        <!-- Name -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"
        placeholder="Enter your name" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
        placeholder="Enter your email" required>
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"
        placeholder="Enter your password" required>
        <br><br>

        <!-- Date -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob">
        <br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"
        placeholder="Enter phone number">
        <br><br>

        <!-- Radio Buttons -->
        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Checkboxes -->
        <label>Select Your Skills:</label><br>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>

        <br><br>

        <!-- Dropdown -->
        <label for="event">Choose an Event:</label><br>

        <select id="event" name="event">

            <option value="">Select Event</option>

            <option value="Web Development">
                Web Development Workshop
            </option>

            <option value="Python Competition">
                Python Competition
            </option>

            <option value="Hackathon">
                Hackathon 2026
            </option>

        </select>

        <br><br>

        <!-- Textarea -->
        <label for="message">Why do you want to join?</label><br>

        <textarea id="message" name="message"
        rows="5" cols="35"
        placeholder="Write your message here..."></textarea>

        <br><br>

        <!-- Submit Button -->
        <button type="submit">Submit Registration</button>

        <button type="reset">Reset</button>

    </form>

    <footer>
        <hr>
        <p>&copy; 2026 Coding Club</p>
    </footer>

</body>
</html>
